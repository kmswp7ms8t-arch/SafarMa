name: SafarMa Frontend CI

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.webmanifest"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.webmanifest"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: |
          cat app1a.js app1b.js compat.js fix-data.js app2a.js app2b.js app3.js app4.js app5.js online-v2.js belink-ai.js result-guard.js > /tmp/safarma-combined.js
          node --check /tmp/safarma-combined.js
          for file in safarma-specialists-v8.js belink-runtime.js belink-client-runtime.js belink-connected-v2.js privacy-controls.js trabzon-preset.js public-mode.js public-launch-guard.js loader.js sw.js; do
            node --check "$file"
          done
      - name: Validate manifests and sitemap
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest-public.webmanifest','utf8'))"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('sitemap.xml')
          print('sitemap.xml is valid XML')
          PY
      - name: Verify V16 personal edition
        run: |
          for page in index.html app.html; do
            grep -q 'name="robots" content="noindex,nofollow,noarchive"' "$page"
            grep -q 'belink-runtime.js?v=16' "$page"
            grep -q 'belink-client-runtime.js?v=16' "$page"
            grep -q 'belink-connected-v2.js?v=9' "$page"
            grep -q 'privacy-controls.js?v=4' "$page"
            grep -q 'trabzon-preset.js?v=3' "$page"
            grep -q 'safarma-specialists-v8.js?v=16' "$page"
            grep -q 'Content-Security-Policy' "$page"
            grep -q 'تولدت مبارک، ساناز' "$page"
          done
          grep -q 'v=16&preset=' trabzon-preset.js
          grep -q 'estimate_needs_live_verification' trabzon-preset.js
          grep -q 'must be checked again when used' trabzon-preset.js
          ! grep -q 'visaConfirmed: true' trabzon-preset.js
          ! grep -q 'guaranteedEntry: true' trabzon-preset.js
      - name: Verify V16 public edition and launch UX
        run: |
          grep -q 'name="robots" content="index,follow,max-image-preview:large"' public.html
          grep -q 'rel="canonical" href="https://kmswp7ms8t-arch.github.io/SafarMa/public.html"' public.html
          grep -q 'og:title' public.html
          grep -q 'manifest-public.webmanifest?v=16' public.html
          grep -q 'public-mode.js?v=2' public.html
          grep -q 'public-launch-guard.js?v=1' public.html
          grep -q 'belink-runtime.js?v=16' public.html
          grep -q 'belink-connected-v2.js?v=9' public.html
          grep -q 'privacy-controls.js?v=4' public.html
          ! grep -q 'trabzon-preset.js' public.html
          ! grep -q 'Sanaz' public.html
          ! grep -q 'ساناز' public.html
          grep -q 'passport: "Qatar"' public-mode.js
          grep -q 'wanted: ""' public-mode.js
          grep -q 'window.SAFARMA_PUBLIC_MODE = true' public-mode.js
          grep -q 'Connected Belink AI is being launched' public-launch-guard.js
          grep -q 'interceptTechnicalSetup' public-launch-guard.js
          grep -q '#belinkBackendBadge' public-launch-guard.js
      - name: Verify PWA, SEO and privacy controls
        run: |
          grep -q 'safarma-v16-public-launch' sw.js
          grep -q 'public-launch-guard.js?v=1' sw.js
          grep -q 'manifest-public.webmanifest?v=16' sw.js
          grep -q 'trabzon-preset.js?v=3' sw.js
          grep -q 'privacy-controls.js?v=4' sw.js
          grep -q 'belink-connected-v2.js?v=9' sw.js
          grep -q '"./?v=16"' manifest.webmanifest
          grep -q '"./public.html?v=16"' manifest-public.webmanifest
          grep -q 'version: "8.5.0-v16"' belink-runtime.js
          grep -q 'const VERSION = "16"' loader.js
          grep -q 'autoAnalyze: false' belink-runtime.js
          grep -q '/api/belink-ai/user-data' privacy-controls.js
          grep -q 'method: "DELETE"' privacy-controls.js
          grep -q 'Allow: /SafarMa/public.html' robots.txt
          grep -q 'Disallow: /SafarMa/app.html' robots.txt
          grep -q 'public.html' sitemap.xml
          grep -q 'pricing.html' sitemap.xml
          grep -q 'request.mode === "navigate"' sw.js
      - name: Ensure exported local snapshot excludes the signed token
        run: |
          python - <<'PY'
          import pathlib, re
          text = pathlib.Path('privacy-controls.js').read_text(encoding='utf-8')
          block = text[text.index('function localSnapshot()'):text.index('function showToast', text.index('function localSnapshot()'))]
          forbidden = [r'client_token\s*:', r'signed_client_token\s*:', r'client_identity\s*:\s*safeGet\(CLIENT_STORAGE\)']
          if any(re.search(pattern, block) for pattern in forbidden):
              raise SystemExit('Local export must not contain the raw signed token.')
          if 'signed_client_identity_present' not in block:
              raise SystemExit('Expected only an identity-presence boolean.')
          PY
      - name: Ensure public assets contain no secret
        run: |
          python - <<'PY'
          import pathlib, re
          patterns = [
              re.compile(r"sk-proj-[A-Za-z0-9_-]{20,}"),
              re.compile(r"sk-[A-Za-z0-9]{32,}"),
              re.compile(r"OPENAI" + r"_API_KEY\s*[:=]\s*['\"]?[^\s'\"]+"),
          ]
          hits = []
          for pattern in ("*.js", "*.css", "*.html", "*.webmanifest", "*.svg", "*.xml", "*.txt"):
              for path in pathlib.Path('.').glob(pattern):
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  if any(secret.search(text) for secret in patterns):
                      hits.append(str(path))
          if hits:
              raise SystemExit('Potential secret found: ' + ', '.join(sorted(set(hits))))
          print('Public asset secret scan passed.')
          PY
