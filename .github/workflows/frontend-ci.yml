name: SafarMa Frontend CI

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "app.html"
      - "manifest.webmanifest"
      - "*.js"
      - "*.css"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "index.html"
      - "app.html"
      - "manifest.webmanifest"
      - "*.js"
      - "*.css"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the loader script in browser order
        run: |
          cat app1a.js app1b.js compat.js fix-data.js app2a.js app2b.js app3.js app4.js app5.js online-v2.js belink-ai.js result-guard.js > /tmp/safarma-combined.js
      - name: Validate JavaScript syntax
        run: |
          node --check /tmp/safarma-combined.js
          node --check safarma-specialists-v8.js
          node --check belink-runtime.js
          node --check belink-client-runtime.js
          node --check belink-connected-v2.js
          node --check loader.js
          node --check sw.js
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Check required release references
        run: |
          for page in index.html app.html; do
            grep -q 'belink-runtime.js' "$page"
            grep -q 'belink-client-runtime.js' "$page"
            grep -q 'belink-connected-v2.js' "$page"
            grep -q 'safarma-specialists-v8.js' "$page"
            grep -q 'safarma-final-v8.css' "$page"
            grep -q 'Content-Security-Policy' "$page"
          done
          grep -q 'belink-client-runtime.js' sw.js
          grep -q 'belink-connected-v2.js' sw.js
          ! grep -q 'caches.match("./index.html")' sw.js || grep -q 'request.mode === "navigate"' sw.js
      - name: Ensure frontend contains no OpenAI secret
        run: |
          ! grep -R --exclude-dir=.git --exclude='*.md' --exclude='.env.example' -E 'sk-proj-[A-Za-z0-9_-]{20,}|OPENAI_API_KEY=' .
