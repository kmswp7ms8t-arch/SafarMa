name: Belink AI backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "belink-ai-v2/backend/**"
      - "scripts/verify-production.py"
      - "render.yaml"
      - ".github/workflows/belink-ai-ci.yml"
      - ".github/workflows/production-verify.yml"
  pull_request:
    paths:
      - "belink-ai-v2/backend/**"
      - "scripts/verify-production.py"
      - "render.yaml"
      - ".github/workflows/belink-ai-ci.yml"
      - ".github/workflows/production-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: belink-ai-v2/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Compile backend and production verifier
        run: |
          uv run python -m compileall -q .
          uv run python -m py_compile ../../scripts/verify-production.py
          uv run python ../../scripts/verify-production.py --help > /dev/null
      - name: Run tests
        run: uv run pytest -q
      - name: Run offline health smoke test
        env:
          BELINK_AI_DATABASE: ./data/ci.sqlite3
          BELINK_SESSION_SECRET: ci-stable-session-secret
          BELINK_REQUIRE_AI: "false"
          PORT: "8421"
        run: |
          uv run python main.py > /tmp/belink-ai.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          python - <<'PY'
          import json, time, urllib.request
          for _ in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8421/ready', timeout=2) as response:
                      payload = json.load(response)
                  assert payload['status'] == 'ready'
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit('Belink AI readiness smoke test failed')
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: ./belink-ai-v2/backend
          file: ./belink-ai-v2/backend/Dockerfile
          load: true
          push: false
          tags: safarma-belink-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run production image as the non-root service user
        run: |
          set -euo pipefail
          docker run -d --name safarma-ci -p 8422:8421 \
            -e BELINK_AI_DATABASE=/tmp/ci.sqlite3 \
            -e BELINK_SESSION_SECRET=ci-docker-session-secret \
            -e BELINK_REQUIRE_SESSION_SECRET=true \
            -e BELINK_REQUIRE_AI=false \
            -e BELINK_ENV=production \
            safarma-belink-ai:ci
          trap 'docker logs safarma-ci || true; docker rm -f safarma-ci || true' EXIT

          test "$(docker exec safarma-ci id -u)" = "10001"

          for attempt in $(seq 1 50); do
            if curl --fail --silent --show-error http://127.0.0.1:8422/ready > /tmp/ready.json; then
              python - <<'PY'
          import json
          payload = json.load(open('/tmp/ready.json', encoding='utf-8'))
          assert payload['status'] == 'ready', payload
          assert payload['database'] is True, payload
          PY
              exit 0
            fi
            sleep 0.5
          done
          echo "Container did not become ready" >&2
          exit 1
