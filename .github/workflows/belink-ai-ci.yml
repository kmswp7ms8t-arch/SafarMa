name: Belink AI backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "belink-ai-v2/backend/**"
      - "render.yaml"
      - ".github/workflows/belink-ai-ci.yml"
  pull_request:
    paths:
      - "belink-ai-v2/backend/**"
      - "render.yaml"
      - ".github/workflows/belink-ai-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: belink-ai-v2/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Compile
        run: uv run python -m compileall -q .
      - name: Run tests
        run: uv run pytest -q
      - name: Run offline health smoke test
        env:
          BELINK_AI_DATABASE: ./data/ci.sqlite3
          BELINK_SESSION_SECRET: ci-stable-session-secret
          BELINK_REQUIRE_AI: "false"
          PORT: "8421"
        run: |
          uv run python main.py > /tmp/belink-ai.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          python - <<'PY'
          import json, time, urllib.request
          for _ in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8421/ready', timeout=2) as response:
                      payload = json.load(response)
                  assert payload['status'] == 'ready'
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit('Belink AI readiness smoke test failed')
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: ./belink-ai-v2/backend
          file: ./belink-ai-v2/backend/Dockerfile
          push: false
          tags: safarma-belink-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
