services:
  - type: web
    name: safarma-belink-ai
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./belink-ai-v2/backend/Dockerfile
    dockerContext: ./belink-ai-v2/backend
    healthCheckPath: /ready
    autoDeploy: true
    maxShutdownDelaySeconds: 60
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: BELINK_AI_MODEL
        value: gpt-5-mini
      - key: BELINK_AI_MAX_TURNS
        value: "20"
      - key: BELINK_CHAT_MAX_TURNS
        value: "10"
      - key: BELINK_ENV
        value: production
      - key: BELINK_REQUIRE_AI
        value: "true"
      - key: BELINK_SESSION_SECRET
        generateValue: true
      - key: BELINK_REQUIRE_SESSION_SECRET
        value: "true"
      - key: BELINK_CORS_ORIGINS
        value: https://kmswp7ms8t-arch.github.io
      - key: BELINK_RATE_LIMIT
        value: "30"
      - key: BELINK_RATE_WINDOW_SECONDS
        value: "60"
      - key: BELINK_MAX_BODY_BYTES
        value: "131072"
      - key: BELINK_ANALYSES_PER_DAY
        value: "5"
      - key: BELINK_CHATS_PER_DAY
        value: "50"
      - key: BELINK_ANALYSIS_CACHE_SECONDS
        value: "900"
      - key: BELINK_AI_DATABASE
        value: /var/data/belink_ai.sqlite3
    disk:
      name: safarma-belink-ai-data
      mountPath: /var/data
      sizeGB: 1
